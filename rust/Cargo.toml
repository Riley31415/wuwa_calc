[package]
name = "wuwa_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = "0.1.52"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

[features]
prof = []

# iteration builds: the same code without LTO, so a one-file edit relinks in seconds
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
