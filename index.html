<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riley Calc</title>
<link rel="stylesheet" href="./index.css">
</head>
<body>

<!--
  The engine is TypeScript now (converted file by file — some of src/ is still plain .js, both
  compile together via tsc's allowJs). `npm run build` (or `npm run watch`) compiles everything
  into dist/, mirroring this project one level deeper (dist/index.js, dist/src/kit.js, ...) —
  that's what actually loads below, so a source edit needs a build pass before a refresh shows
  it. The page still has to be served rather than opened off disk — browsers block module
  imports and fetch() on file:// URLs. From this directory:

      npm run build                     ->  compiles src/**/*.ts (+ passthrough .js) into dist/
      python -m http.server 8000        ->  http://localhost:8000/
-->

<div id="teamSwitch" class="teamswitch">
  <div class="teambtns">
    <button type="button" class="teambtn active" data-team="skIunoJingran">Shorekeeper Iuno Jingran team</button>
    <button type="button" class="teambtn" data-team="lupaIunoJingran">Lupa Iuno Jingran team</button>
    <button type="button" class="teambtn" data-team="froloQyCanta">Phrolova Qiuyuan Cantarella team</button>
    <button type="button" class="teambtn" data-team="froloQyCantaS6R5">Phrolova Qiuyuan Cantarella S6R5 team</button>
    <button type="button" class="teambtn" data-team="froloSkCanta">Phrolova Shorekeeper Cantarella team</button>
    <button type="button" class="teambtn" data-team="froloSkCantaS6R5">Phrolova Shorekeeper Cantarella S6R5 team</button>
    <button type="button" class="teambtn" data-team="lupaBrantJingran">Lupa Brant Jingran team</button>
    <button type="button" class="teambtn" data-team="skSanhuaBrant">Shorekeeper Sanhua Brant team</button>
    <button type="button" class="teambtn" data-team="froloBulingCanta">Phrolova Buling Cantarella team</button>
    <button type="button" class="teambtn" data-team="froloBulingCantaS6R5">Phrolova Buling Cantarella S6R5 team</button>
    <button type="button" class="teambtn" data-team="froloLucillaCanta">Phrolova Lucilla Cantarella team</button>
    <button type="button" class="teambtn" data-team="froloLucillaCantaS6R5">Phrolova Lucilla Cantarella S6R5 team</button>
    <button type="button" class="teambtn" data-team="froloSkLucilla">Phrolova Shorekeeper Lucilla team</button>
    <button type="button" class="teambtn" data-team="froloSkLucillaS6R5">Phrolova Shorekeeper Lucilla S6R5 team</button>
    <button type="button" class="teambtn" data-team="froloQyLucilla">Phrolova Qiuyuan Lucilla team</button>
    <button type="button" class="teambtn" data-team="froloQyLucillaS6R5">Phrolova Qiuyuan Lucilla S6R5 team</button>
    <button type="button" class="teambtn" data-team="skZhezhiCarlotta">Shorekeeper Zhezhi Carlotta team</button>
    <button type="button" class="teambtn" data-team="skIunoAugusta">Shorekeeper Iuno Augusta team</button>
  </div>
  <div class="chips" id="headerChips"></div>
</div>

<div id="app" class="loading">
  <div class="spinner"></div>
  <p>running the rotation…</p>
</div>

<script type="module" src="./dist/index.js"></script>
</body>
</html>
