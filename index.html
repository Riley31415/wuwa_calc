<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- A plain static host may cache aggressively enough to serve a stale stylesheet or bundle off
     an ordinary reload — which looks exactly like "the edit did nothing". dev.py sends no-store
     itself; this covers every other host. -->
<meta http-equiv="Cache-Control" content="no-store">
<title>Skittle Calcs</title>
<meta property="og:title" content="Skittle Calcs">
<meta property="og:description" content="WuWa team damage and build comparison for 123 rotations.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://riley31415.github.io/wuwa_calc/">
<meta property="og:image" content="https://riley31415.github.io/wuwa_calc/resources/preview.jpg">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#f2074a">
<link rel="icon" type="image/png" sizes="96x64" href="./resources/favicon.png">
<link rel="stylesheet" href="./resources/index.css">
</head>
<body>

<!--
  The engine is TypeScript. tsc compiles src/**/*.ts into dist/src/ (mirroring this project one
  level deeper), and esbuild then folds those ~70 modules into the two files that actually load
  below — dist/bundle/index.js and the worker's dist/bundle/solver.js (see dev.py on why:
  eight workers each fetching the whole module graph was most of a cold load's startup). A
  source edit needs both passes before a refresh shows it. The page still has to be served
  rather than opened off disk — browsers block module imports and fetch() on file:// URLs. From
  this directory:

      npm run build                     ->  tsc into dist/src/, then esbuild into dist/bundle/
      python dev.py                     ->  tsc --watch + esbuild --watch + a no-store server
                                            with hot reload, all in one; what the logon entry
                                            runs, so normally this is already up

  Use 127.0.0.1, not localhost — see dev.py's own header on the ~200ms-per-connection stall
  "localhost" costs on Windows, paid on every request.
-->

<div id="topbar" class="topbar" hidden>
  <a id="backLink" class="backlink" href="#">&larr; Back</a>
</div>

<script>
  // Hot reload, the page's half: poll dev.py's /__livereload endpoint and reload the moment it
  // reports any watched .html/.css/.js file changed, so a fix on disk (or a `tsc` run finishing)
  // reaches the screen with no manual refresh. Talks to that one path only; the first answer that
  // isn't a stamp (a 404 off GitHub Pages, say) means "not on dev.py", and the polling stops.
  (function poll() {
    let last = null;
    const timer = setInterval(async () => {
      try {
        const res = await fetch("/__livereload", { cache: "no-store" });
        if (!res.ok) { clearInterval(timer); return; }
        const v = await res.text();
        if (last === null) { last = v; return; } // baseline on first successful poll, not a reload
        if (v !== last) location.reload();
      } catch { /* server mid-restart — try again next tick */ }
    }, 500);
  })();
</script>

<div id="app"></div>

<!-- The loading state lives here rather than being written by the script, so it is on screen
     while the module is still being fetched and parsed. It is an overlay over #app, not a page
     of its own: boot() draws the empty table (filters, header, no rows) underneath first and
     this floats above it, blurring it, while the teams actually run. boot() drives the fill and
     the count in place and hides the whole thing when there is nothing left to run; it never
     replaces this markup. -->
<div id="loading">
  <p class="loading-status">
    <span class="status-text">Initializing…</span>
    <span class="progress-count"></span>
  </p>
  <div class="progress-track"><div class="progress-fill"></div></div>
  <!-- the sticker the favicon is cut from, whole, at its own size -->
  <img class="loading-gif" src="./resources/loading.gif" alt="" width="110" height="79">
  <!-- anything that goes wrong while the page loads lands here, in full, rather than only in a
       console nobody has open (the handlers below) -->
  <pre class="loading-error" hidden></pre>
</div>

<script>
  // Every error on the way up — a chunk that failed to fetch, a kit that threw at import, the
  // boot itself — is written onto the loading screen, which is put back up if it had gone.
  // Wired here, ahead of the module, so the module failing to load at all is caught too.
  (function () {
    function show(text) {
      var box = document.querySelector("#loading .loading-error");
      if (!box) return;
      box.hidden = false;
      box.textContent += (box.textContent ? "\n\n" : "") + text;
      document.getElementById("loading").hidden = false;
    }
    addEventListener("error", function (e) {
      var err = e.error;
      show(err && err.stack ? err.stack : e.message ? e.message + (e.filename ? " (" + e.filename + ":" + e.lineno + ")" : "") : String(e));
    });
    addEventListener("unhandledrejection", function (e) {
      var r = e.reason;
      show(r && r.stack ? r.stack : String(r));
    });
    // A press anywhere on an error box takes the whole thing — selected, and on the clipboard, so
    // a stack goes straight into a bug report. Delegated from here, ahead of the module, for the
    // same reason the handlers above are: the module is what may have failed. It reaches the
    // detail page's own `.error` box the same way, whenever the module renders one later.
    // A selection the reader dragged out for themselves is left as it is.
    document.addEventListener("click", function (e) {
      var box = e.target && e.target.closest && e.target.closest(".loading-error, .error");
      if (!box) return;
      var sel = getSelection();
      if (sel && !sel.isCollapsed) return;
      var range = document.createRange();
      range.selectNodeContents(box);
      if (sel) { sel.removeAllRanges(); sel.addRange(range); }
      // execCommand is the fallback off a secure context, where there is no clipboard API at all
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(box.innerText).catch(function () { document.execCommand("copy"); });
      } else {
        document.execCommand("copy");
      }
    });
  })();
</script>

<!-- Loaded by hand with a fresh query string rather than a plain src: GitHub Pages serves every
     file with max-age=600, and a bundle fetched under a name that never changes can be handed
     back stale for ten minutes after a deploy — half a page on the new engine, half on the old.
     A string nothing cached, and the chunks the bundle imports carry a content hash of their
     own. index.ts busts the worker's own entry the same way. -->
<script type="module">import(`./dist/bundle/index.js?v=${Date.now()}`);</script>
</body>
</html>
