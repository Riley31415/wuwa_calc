<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riley Calc</title>
<link rel="stylesheet" href="./index.css">
</head>
<body>

<!--
  The engine is TypeScript now (converted file by file — some of src/ is still plain .js, both
  compile together via tsc's allowJs). `npm run build` (or `npm run watch`) compiles everything
  into dist/, mirroring this project one level deeper (dist/index.js, dist/src/kit.js, ...) —
  that's what actually loads below, so a source edit needs a build pass before a refresh shows
  it. The page still has to be served rather than opened off disk — browsers block module
  imports and fetch() on file:// URLs. From this directory:

      npm run build                     ->  compiles src/**/*.ts (+ passthrough .js) into dist/
      python -m http.server 8000        ->  http://localhost:8000/
-->

<div id="teamSwitch" class="teamswitch">
  <div class="teambtns">
    <button type="button" class="teambtn active" data-team="sk">Shorekeeper team</button>
    <button type="button" class="teambtn" data-team="lupa">Lupa team</button>
    <button type="button" class="teambtn" data-team="phro">Phrolova team</button>
    <button type="button" class="teambtn" data-team="phroSk">Phrolova SK team</button>
    <button type="button" class="teambtn" data-team="lupaBrant">Lupa Brant team</button>
    <button type="button" class="teambtn" data-team="skSanhuaBrant">SK Sanhua Brant team</button>
    <button type="button" class="teambtn" data-team="froloBulingCanta">Frolo Buling Canta team</button>
    <button type="button" class="teambtn" data-team="froloLucillaCanta">Frolo Lucilla Canta team</button>
    <button type="button" class="teambtn" data-team="froloSkLucilla">Frolo SK Lucilla team</button>
    <button type="button" class="teambtn" data-team="froloQyLucilla">Frolo QY Lucilla team</button>
  </div>
  <div class="chips" id="headerChips"></div>
</div>

<div id="app" class="loading">
  <div class="spinner"></div>
  <p>running the rotation…</p>
</div>

<script type="module" src="./dist/index.js"></script>
</body>
</html>
